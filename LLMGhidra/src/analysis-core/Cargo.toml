[package]
name = "llmghidra-analysis"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[dependencies]
capstone = { version = "0.14", default-features = false, features = ["std", "full", "arch_arm64"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
rusqlite = { version = "0.32.1", features = ["bundled"] }
gimli = { version = "0.31.1", default-features = false, features = ["read", "std"] }
sha2 = "0.10.9"

