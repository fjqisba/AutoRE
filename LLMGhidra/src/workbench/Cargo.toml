[package]
name = "llmghidra-workbench"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[dependencies]
llmghidra-analysis = { path = "../analysis-core" }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.15", default-features = false }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

